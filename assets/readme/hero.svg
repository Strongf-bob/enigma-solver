<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Enigma Bombe Solver — encrypt, set a crib, search rotor positions</title>
  <desc id="desc">Three brass rotor windows feed a browser-based crib search from ciphertext to matching rotor positions.</desc>
  <rect width="1200" height="380" rx="24" fill="#101820"/>
  <path d="M48 310H1152" stroke="#6C8EA3" opacity=".35"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="56" y="64" fill="#C47A44" font-size="18" font-weight="700" letter-spacing="3">INTERACTIVE CRYPTOGRAPHY LAB</text>
    <text x="56" y="143" fill="#F3EBDD" font-size="60" font-family="Georgia,'Times New Roman',serif" font-weight="700">Enigma Bombe Solver</text>
    <text x="56" y="192" fill="#B7C8D2" font-size="25">Encrypt with three rotors. Crack positions with a known crib.</text>
    <g transform="translate(56 242)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">
      <text x="0" y="26" fill="#F3EBDD">CIPHERTEXT</text>
      <path d="M126 20H188" stroke="#C47A44" stroke-width="2"/>
      <text x="205" y="26" fill="#F3EBDD">CRIB</text>
      <path d="M254 20H316" stroke="#C47A44" stroke-width="2"/>
      <text x="333" y="26" fill="#F3EBDD">17,576 POSITIONS</text>
    </g>
    <g transform="translate(806 50)">
      <g fill="#263A47" stroke="#C47A44" stroke-width="3">
        <circle cx="66" cy="108" r="64"/><circle cx="166" cy="108" r="64"/><circle cx="266" cy="108" r="64"/>
      </g>
      <g fill="#F3EBDD" font-size="42" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">
        <text x="66" y="122">I</text><text x="166" y="122">II</text><text x="266" y="122">III</text>
      </g>
      <path d="M22 224H310" stroke="#6C8EA3" stroke-width="2"/>
      <rect x="68" y="206" width="196" height="38" rx="4" fill="#F3EBDD"/>
      <text x="166" y="232" fill="#101820" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">AAA → MATCH</text>
    </g>
  </g>
</svg>
